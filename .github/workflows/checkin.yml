name: vsllm 每日签到

on:
  schedule:
    # 北京时间每天 01:00 执行（cron 为 UTC 17:00，对应前一天）
    - cron: "0 17 * * *"
  workflow_dispatch: {}

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 执行签到
        env:
          VSLLM_ACCESS_TOKENS: ${{ secrets.VSLLM_ACCESS_TOKENS }}
          VSLLM_BASE_URL: ${{ secrets.VSLLM_BASE_URL }}
          VSLLM_COOKIE: ${{ secrets.VSLLM_COOKIE }}
          VSLLM_UA: ${{ secrets.VSLLM_UA }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          CF_COOKIE: ${{ secrets.CF_COOKIE }}
        run: bash checkin.sh
